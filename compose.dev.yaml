# 本地开发覆盖文件。执行：docker compose --env-file compose.dev.env -f compose.yaml -f compose.dev.yaml up --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    image: xianyu2:dev
    environment:
      APP_IMAGE_DIGEST: development
    volumes:
      - ${RUNTIME_HOST_DIR:-./.runtime}:/app/runtime:ro
      - ${UPDATE_REQUEST_HOST_DIR:-./.update/request}:/app/update/request
      - ${UPDATE_STATUS_HOST_DIR:-./.update/status}:/app/update/status:ro
