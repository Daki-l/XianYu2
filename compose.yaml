name: xianyu2

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-xianyu2}
      MYSQL_USER: ${DB_USERNAME:-xianyu2}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max-connections=100
      - --log-bin-trust-function-creators=1
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - xianyu2

  app:
    # 生产环境由受管 release.env 传入不可变 digest；本地构建请使用 compose.dev.yaml。
    image: ${APP_IMAGE:?release.env is required for production Compose}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-xianyu2}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
      DB_USERNAME: ${DB_USERNAME:-xianyu2}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:12400}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=20 -XX:+ExitOnOutOfMemoryError}
      UPDATE_RELEASE_API: ${UPDATE_RELEASE_API:-https://api.github.com/repos/Daki-l/XianYu2/releases/latest}
      UPDATE_ENABLED: ${UPDATE_ENABLED:-false}
      UPDATE_REQUEST_DIR: /app/update/request
      UPDATE_STATUS_DIR: /app/update/status
      APP_IMAGE_DIGEST: ${APP_IMAGE_DIGEST:?release.env is required for production Compose}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:12400:12400"
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
      - ${RUNTIME_HOST_DIR:-/var/lib/xianyu2/runtime}:/app/runtime:ro
      - ${UPDATE_REQUEST_HOST_DIR:-/var/lib/xianyu2/update/request}:/app/update/request
      - ${UPDATE_STATUS_HOST_DIR:-/var/lib/xianyu2/update/status}:/app/update/status:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:12400/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - xianyu2

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - xianyu2

volumes:
  mysql-data:
  app-data:
  app-logs:

networks:
  xianyu2:
    driver: bridge
