name: Verify XianYu2

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.webp'
      - '**/*.svg'
      - '**/*.pdf'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'DISCLAIMER.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xianyu2-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PLAYWRIGHT_BASE_IMAGE: ghcr.io/daki-l/xianyu2-playwright

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Lint workflow configuration
        run: |
          set -Eeuo pipefail
          bash scripts/ci/check-workflow-pinning.sh
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.9
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

  migration-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check migration versions
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          base_sha="${BASE_SHA:-}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${HEAD_SHA}^")"
          fi
          bash scripts/ci/check-migration-versions.sh "$base_sha" "$HEAD_SHA"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests
        run: |
          ./mvnw -B "-Drevision=0.0.0-dev+${GITHUB_SHA::12}" test
          bash deploy/update/test-update-agent.sh
          bash scripts/release/test-release-packaging.sh

  playwright-base-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-build: ${{ steps.config.outputs.should-build }}
      version: ${{ steps.config.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: config
        name: Validate Playwright base image configuration
        env:
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          base_sha="${BASE_SHA:-}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse "${HEAD_SHA}^")"
          fi
          version="$(bash scripts/ci/check-playwright-base.sh --version "$HEAD_SHA")"
          should_build="$(bash scripts/ci/check-playwright-base.sh --changed "$base_sha" "$HEAD_SHA")"
          printf 'version=%s\nshould-build=%s\n' "$version" "$should_build" >> "$GITHUB_OUTPUT"

  publish-playwright-base:
    needs: [workflow-lint, test, playwright-base-check]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.workflow-lint.result == 'success' && needs.test.result == 'success' &&
      needs.playwright-base-check.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile.playwright-base
          platforms: linux/amd64
          push: true
          tags: ${{ env.PLAYWRIGHT_BASE_IMAGE }}:v${{ needs.playwright-base-check.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=XianYu2 Playwright Chromium browser layer
          cache-from: type=gha,scope=playwright-base
          cache-to: type=gha,mode=max,scope=playwright-base

  build-and-smoke-test:
    needs: [workflow-lint, migration-check, test, playwright-base-check, publish-playwright-base]
    if: >-
      always() && needs.workflow-lint.result == 'success' && needs.migration-check.result == 'success' && needs.test.result == 'success' &&
      (needs.publish-playwright-base.result == 'success' || needs.publish-playwright-base.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build a local Playwright base when a pull request changes it
        if: github.event_name == 'pull_request' && needs.playwright-base-check.outputs.should-build == 'true'
        run: docker build -f Dockerfile.playwright-base -t xianyu2-playwright:ci .
      - name: Build development image and run health smoke test
        env:
          IMAGE: xianyu2:ci-${{ github.sha }}
          PLAYWRIGHT_OVERRIDE: ${{ github.event_name == 'pull_request' && needs.playwright-base-check.outputs.should-build == 'true' && 'xianyu2-playwright:ci' || format('{0}:v{1}', env.PLAYWRIGHT_BASE_IMAGE, needs.playwright-base-check.outputs.version) }}
        run: |
          docker build -f Dockerfile.dev \
            --build-arg APP_VERSION="0.0.0-dev+${GITHUB_SHA::12}" \
            --build-arg PLAYWRIGHT_BASE_IMAGE="$PLAYWRIGHT_OVERRIDE" \
            -t "$IMAGE" .
          bash scripts/ci/smoke-test-container.sh "$IMAGE"
          bash scripts/ci/test-update-mount-permissions.sh "$IMAGE"
          bash scripts/ci/test-update-mount-permissions.sh "$IMAGE" deploy/server/compose-existing-mysql.yaml
