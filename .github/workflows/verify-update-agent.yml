name: Verify Update Agent

on:
  pull_request:
    paths:
      - 'deploy/update/**'
      - 'scripts/release/**'
      - 'release-metadata/**'
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - 'vue-code/**'
      - '.github/workflows/verify-update-agent.yml'
  push:
    branches:
      - main
    paths:
      - 'deploy/update/**'
      - 'scripts/release/**'
      - 'release-metadata/**'
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - 'vue-code/**'
      - '.github/workflows/verify-update-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vue-code/package-lock.json

      - name: Type check frontend
        working-directory: vue-code
        run: |
          set -Eeuo pipefail
          npm ci
          npm run type-check

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: |
          set -Eeuo pipefail
          ./mvnw -B -Drevision=0.0.0-ci test

  update-agent:
    name: Update Agent Regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check shell syntax
        run: |
          set -Eeuo pipefail
          bash -n deploy/update/xianyu2-update-agent
          bash -n deploy/update/install-update-agent.sh
          bash -n deploy/update/install-release.sh
          bash -n deploy/update/test-update-agent.sh
          bash -n scripts/release/validate-release-metadata.sh
          bash -n scripts/release/generate-release-manifest.sh

      - name: Run update agent regression suite
        run: |
          set -Eeuo pipefail
          bash deploy/update/test-update-agent.sh

      - name: Run release package regression suite
        run: |
          set -Eeuo pipefail
          bash scripts/release/test-release-packaging.sh
